<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCord Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../Scripts/appCore.js"></script>
  <script src="../Scripts/supabaseClient.js"></script>
</head>
<body id="pages" class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-subtitle">Join MiniCord and start chatting.</p>

      <div id="loadingScreen" class="loading-screen">Creating your account...</div>

      <form id="signUpForm" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <label for="displayName">Display Name</label>
        <input type="text" id="displayName" placeholder="Display Name" required />

        <button id="signUpBtn" type="submit">Sign Up</button>
      </form>

      <div class="line-container">
        <p>OR</p>
      </div>

      <button class="google-btn" type="button" id="googleSignUpBtn">
        <img src="../Assests/google.svg" alt="Google Logo" class="google-logo" />
        <span>Sign Up with Google</span>
      </button>

      <p class="auth-link">
        Already have an account?
        <a href="SignIn.html">Sign In</a>
      </p>
    </section>
  </main>

  <script src="../Scripts/signIn.js"></script>
  <script src="../Scripts/Theme.js"></script>
</body>
</html>
