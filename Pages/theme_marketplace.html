<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Marketplace</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button id="side_btn">&lt;</button>
    <button id="servers">Servers</button>
    <button id="settings">Settings</button>
    <button id="thememarketplace">Theme marketplace</button>
    <button id="logout">Logout</button>
  </div>

  <div id="pages" class="marketplace-page">
    <section class="content-page marketplace-section">
      <div class="page-shell marketplace-shell">
        <div class="page-card marketplace-card">
          <div class="marketplace-header">
            <div>
              <h1>Theme Marketplace</h1>
              <p>Upload your own theme and download themes shared by other users.</p>
            </div>
            <div class="marketplace-badges">
              <span class="marketplace-badge">Shared themes</span>
              <span class="marketplace-badge">Easy install</span>
            </div>
          </div>

          <div class="marketplace-layout">
            <div class="marketplace-sidebar">
              <div class="page-actions">
                <label class="upload-card">
                  <span>Upload a CSS theme</span>
                  <input type="file" id="themeUpload" accept=".css,text/css">
                </label>
                <button id="applySharedTheme" type="button">Apply selected theme</button>
                <button id="backToSettings" type="button">Back to settings</button>
              </div>
              <div class="marketplace-tip">
                <h3>How it works</h3>
                <p>Select a theme card, then apply it to refresh the look of the whole app.</p>
              </div>
            </div>

            <div class="marketplace-content">
              <div id="marketplaceStatus" class="settings-status">Loading themes…</div>
              <div id="themeList" class="theme-list"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../Scripts/appCore.js"></script>
  <script src="../Scripts/supabaseClient.js"></script>
  <script src="../Scripts/Theme.js"></script>
  <script src="../Scripts/sidebar.js" type="module"></script>
  <script src="../Scripts/themeMarketplace.js" type="module"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.sidebarModule?.bindSidebar) {
        window.sidebarModule.bindSidebar();
      }
    });
  </script>
</body>
</html>
